name: Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NovaHdProvider Only
        run: chmod +x gradlew && ./gradlew :NovaHdProvider:make

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: temp_builds

      - name: Copy CS3 and Generate plugins.json
        run: |
          rm -f temp_builds/*.cs3
          cp -f NovaHdProvider/build/*.cs3 temp_builds/
          cat << 'EOF' > temp_builds/plugins.json
          [
            {
              "apiVersion": 1,
              "repositoryUrl": "https://github.com/Anamul-pa/extensions",
              "fileSize": 10000,
              "status": 1,
              "language": "en",
              "authors": ["Anamul"],
              "tvTypes": ["Movie", "TvSeries"],
              "version": 1,
              "internalName": "NovaHdProvider",
              "description": "NovaHD Movies and TV Series Provider",
              "url": "https://raw.githubusercontent.com/Anamul-pa/extensions/builds/NovaHdProvider.cs3",
              "name": "NovaHdProvider"
            }
          ]
          EOF
          cd temp_builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add NovaHdProvider v1" || exit 0
          git push -f origin builds
