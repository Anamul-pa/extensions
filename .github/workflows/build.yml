name: Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugins
        run: chmod +x gradlew && ./gradlew :DesiDubAnime:make makePluginsJson

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: temp_builds

      - name: Copy and Push to builds branch
        run: |
          cp -f DesiDubAnime/build/*.cs3 temp_builds/ 2>/dev/null || true
          cp -f build/plugins.json temp_builds/ 2>/dev/null || true
          cd temp_builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update plugins" || exit 0
          git push
