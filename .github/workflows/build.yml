name: Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DesiDubAnime Only
        run: chmod +x gradlew && ./gradlew :DesiDubAnime:make

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: temp_builds

      - name: Copy CS3 and Generate plugins.json
        run: |
          cp -f DesiDubAnime/build/*.cs3 temp_builds/
          cat << 'EOF' > temp_builds/plugins.json
          [
            {
              "iconUrl": "https://www.google.com/s2/favicons?domain=desidubanime.me&sz=%size%",
              "apiVersion": 1,
              "repositoryUrl": "https://github.com/Anamul-pa/extensions",
              "fileSize": 10000,
              "status": 1,
              "language": "hi",
              "authors": ["Custom"],
              "tvTypes": ["Anime", "AnimeMovie", "OVA"],
              "version": 4,
              "internalName": "DesiDubAnime",
              "description": "Hindi Dubbed Anime from DesiDubAnime",
              "url": "https://raw.githubusercontent.com/Anamul-pa/extensions/builds/DesiDubAnime.cs3",
              "name": "DesiDubAnime"
            }
          ]
          EOF
          cd temp_builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update DesiDubAnime plugin to v2" || exit 0
          git push
