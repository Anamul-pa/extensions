name: Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugins
        run: chmod +x gradlew && ./gradlew make

      - name: Upload Extensions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesiDubAnime-Extension
          path: "**/build/*.cs3"
